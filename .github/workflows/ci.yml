name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # Без -s: этот флаг пропускает сборку фронтенда, а в чистом клоне
      # frontend/dist пуст — go:embed вшил бы пустоту, и exe открывал бы
      # пустое окно, причём сборка при этом считалась бы успешной.
      - name: Build
        run: wails build -nsis=false
