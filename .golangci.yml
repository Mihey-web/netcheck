# Минимальный набор: только то, что ловит настоящие ошибки.
# Стилистические линтеры не включаем сознательно — шум без пользы.
version: "2"

linters:
  default: none
  enable:
    - govet       # подозрительные конструкции: printf-форматы, копии мьютексов
    - staticcheck # баги и мёртвые ветки (SA-серия; шумные ST-проверки выключены по умолчанию)
    - unused      # неиспользуемые функции, поля, переменные
    - ineffassign # присваивания, которые никто не читает
  settings:
    staticcheck:
      # Только SA-серия (реальные баги). ST (стиль) и QF (подсказки
      # «можно короче») — шум: QF1008 требовал убирать явный .Header
      # в разборе DNS, где явность — достоинство.
      checks: ["all", "-ST*", "-QF*"]
